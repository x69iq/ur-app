<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>أُور - خرائط وملاحة العراق</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      color: #ffffff;
    }

    #map {
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* الشريط العلوي للتوجيه */
    .nav-banner {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      background: #0284c7;
      border-radius: 18px;
      padding: 16px 20px;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    .nav-banner.active {
      display: flex;
    }

    .nav-info {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .nav-info i {
      font-size: 32px;
    }

    .nav-text .dist {
      font-size: 24px;
      font-weight: bold;
    }

    .nav-text .street {
      font-size: 14px;
      opacity: 0.9;
    }

    /* عداد السرعة */
    .speedometer {
      position: absolute;
      bottom: 180px;
      left: 16px;
      width: 60px;
      height: 60px;
      background: #1e293b;
      border: 2px solid #0284c7;
      border-radius: 30px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    .speed-val {
      font-size: 18px;
      font-weight: bold;
    }

    .speed-unit {
      font-size: 8px;
      color: #94a3b8;
    }

    /* القائمة السفلية */
    .bottom-sheet {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: #0f172a;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      padding: 20px;
      z-index: 1000;
      border-top: 1px solid #334155;
      box-shadow: 0 -5px 25px rgba(0,0,0,0.5);
    }

    .search-box {
      background: #1e293b;
      border-radius: 14px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .search-box input {
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 16px;
      width: 100%;
    }

    .btn-primary {
      width: 100%;
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-danger {
      background: #ef4444;
    }

    .floating-btn {
      position: absolute;
      right: 16px;
      bottom: 180px;
      width: 48px;
      height: 48px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 24px;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      cursor: pointer;
    }

    /* نافذة الوصول للوجهة */
    .arrival-modal {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.95);
      z-index: 2000;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    .arrival-modal.active {
      display: flex;
    }

    .icon-box {
      width: 80px;
      height: 80px;
      background: #22c55e;
      border-radius: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <!-- الخريطة -->
  <div id="map"></div>

  <!-- شريط التوجيه المباشر -->
  <div class="nav-banner" id="navBanner">
    <div class="nav-info">
      <i class="fa-solid fa-turn-right"></i>
      <div class="nav-text">
        <div class="dist" id="turnDist">70 م</div>
        <div class="street" id="nextStreet">انعطف يميناً نحو طريق كركوك - بغداد</div>
      </div>
    </div>
  </div>

  <!-- عداد السرعة -->
  <div class="speedometer">
    <div class="speed-val" id="speedVal">45</div>
    <div class="speed-unit">كم/س</div>
  </div>

  <!-- زر إعادة التوسيط -->
  <div class="floating-btn" id="recenterBtn" onclick="recenterMap()">
    <i class="fa-solid fa-location-crosshairs"></i>
  </div>

  <!-- الشريط السفلي -->
  <div class="bottom-sheet" id="bottomSheet">
    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass" style="color: #94a3b8;"></i>
      <input type="text" placeholder="إلى أين تتجه اليوم؟" id="searchInput" />
    </div>

    <div id="routePreview" style="display: none; margin-bottom: 12px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
        <span style="font-size: 20px; font-weight: bold;">7 دقائق</span>
        <span style="color: #94a3b8;">2.3 كم</span>
      </div>
      <p style="color: #94a3b8; font-size: 13px; margin-bottom: 12px;">عبر طريق كركوك - بغداد • أفضل مسار</p>
    </div>

    <button class="btn-primary" id="actionBtn" onclick="toggleNavigation()">انطلق الآن</button>
  </div>

  <!-- نافذة الوصول للوجهة -->
  <div class="arrival-modal" id="arrivalModal">
    <div class="icon-box"><i class="fa-solid fa-flag-checkered"></i></div>
    <h2 style="font-size: 24px; margin-bottom: 8px;">وصلت إلى وجهتك بالسلامة!</h2>
    <p style="color: #94a3b8; margin-bottom: 24px;">استغرقت الرحلة 7 دقائق (2.3 كم)</p>
    <button class="btn-primary" onclick="closeArrivalModal()">العودة للخريطة</button>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const map = L.map('map', { zoomControl: false }).setView([33.3152, 44.3661], 14);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap & CartoDB'
    }).addTo(map);

    let isNavigating = false;
    let userMarker, activePolyline;

    const routeCoords = [
      [33.3152, 44.3661],
      [33.3200, 44.3680],
      [33.3250, 44.3720]
    ];

    userMarker = L.marker([33.3152, 44.3661]).addTo(map);

    function toggleNavigation() {
      const btn = document.getElementById('actionBtn');
      const banner = document.getElementById('navBanner');
      const preview = document.getElementById('routePreview');

      if (!isNavigating) {
        isNavigating = true;
        btn.innerText = "إنهاء الرحلة";
        btn.classList.add("btn-danger");
        banner.classList.add("active");
        preview.style.display = "block";

        activePolyline = L.polyline(routeCoords, { color: '#38bdf8', weight: 6, opacity: 0.9 }).addTo(map);
        map.fitBounds(activePolyline.getBounds(), { padding: [50, 50] });

        setTimeout(() => {
          if (isNavigating) finishTrip();
        }, 6000);

      } else {
        finishTrip();
      }
    }

    function finishTrip() {
      isNavigating = false;
      document.getElementById('actionBtn').innerText = "انطلق الآن";
      document.getElementById('actionBtn').classList.remove("btn-danger");
      document.getElementById('navBanner').classList.remove("active");
      document.getElementById('routePreview').style.display = "none";

      if (activePolyline) map.removeLayer(activePolyline);
      
      document.getElementById('arrivalModal').classList.add("active");
    }

    function closeArrivalModal() {
      document.getElementById('arrivalModal').classList.remove("active");
      recenterMap();
    }

    function recenterMap() {
      map.setView([33.3152, 44.3661], 15);
    }
  </script>
</body>
</html>
