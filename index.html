<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>أُور - خرائط وملاحة العراق</title>

  <!-- إعدادات تحويل الصفحة إلى تطبيق مثبت (PWA & Mobile App Mode) -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="أُور">
  <meta name="theme-color" content="#070B14">

  <!-- Leaflet CSS للخرائط التفاعلية -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      background: #070B14;
      color: #FFFFFF;
      overflow: hidden;
    }

    .screens-wrapper {
      width: 100%;
      height: 100%;
      position: relative;
    }

    .screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      transition: opacity 0.6s ease, transform 0.6s ease;
      opacity: 0;
      pointer-events: none;
      transform: scale(0.97);
      z-index: 1;
    }

    .screen.active {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
      z-index: 10;
    }

    /* -----------------------------------
       الواجهة الأولى: اللوجو برمز زقورة أور
    ----------------------------------- */
    #screen1 {
      padding: 60px 24px 50px;
    }

    .logo-container {
      margin: auto 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      cursor: pointer;
    }

    .logo-glow {
      position: absolute;
      width: 190px;
      height: 190px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.35) 0%, rgba(234, 179, 8, 0.15) 50%, rgba(3, 7, 18, 0) 70%);
      filter: blur(25px);
      border-radius: 50%;
      animation: pulseGlow 2.5s infinite alternate;
    }

    .logo-box {
      position: relative;
      width: 160px;
      height: 160px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), inset 0 0 15px rgba(56, 189, 248, 0.15);
      animation: logoPop 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .logo-svg {
      width: 110px;
      height: 110px;
    }

    .brand-title {
      font-size: 44px;
      font-weight: 900;
      margin-top: 24px;
      letter-spacing: 3px;
      background: linear-gradient(180deg, #FFFFFF 30%, #38BDF8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-subtitle {
      color: #64748B;
      font-size: 13px;
      font-weight: 700;
      margin-top: 4px;
      letter-spacing: 2px;
    }

    .bottom-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 28px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 30px;
      color: #E2E8F0;
      font-size: 14px;
      font-weight: 700;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    /* -----------------------------------
       الواجهة الثانية: اختيار اللغة
    ----------------------------------- */
    #screen2 {
      padding: 60px 24px 50px;
    }

    .lang-header-box {
      text-align: center;
      margin-top: 30px;
    }

    .lang-title {
      font-size: 22px;
      font-weight: 800;
      color: #F8FAFC;
      line-height: 1.6;
    }

    .lang-title span {
      display: block;
      font-size: 16px;
      color: #38BDF8;
      font-weight: 600;
      margin-top: 4px;
    }

    .lang-title .kurdish {
      color: #94A3B8;
      font-size: 15px;
    }

    .buttons-container {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin: auto 0;
    }

    .lang-card {
      width: 100%;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(56, 189, 248, 0.2);
      padding: 20px 24px;
      border-radius: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      backdrop-filter: blur(12px);
      transition: all 0.25s ease;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    .lang-card:active {
      transform: scale(0.97);
      border-color: #38BDF8;
      background: linear-gradient(135deg, rgba(14, 165, 233, 0.2) 0%, rgba(3, 7, 18, 0.8) 100%);
    }

    .lang-name { font-size: 18px; font-weight: 700; color: #FFFFFF; }
    .lang-sub { font-size: 13px; color: #64748B; margin-top: 2px; }
    .lang-arrow {
      width: 28px; height: 28px; border-radius: 50%;
      background: rgba(56, 189, 248, 0.1); color: #38BDF8;
      display: flex; justify-content: center; align-items: center; font-size: 14px;
    }

    /* -----------------------------------
       الواجهة الثالثة: الخريطة الرئيسية
    ----------------------------------- */
    #screen3 {
      padding: 0;
      justify-content: flex-start;
      position: relative;
    }

    #map {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      background: #070B14;
    }

    .dark-map-tiles .leaflet-tile {
      filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3) brightness(0.7);
    }

    .leaflet-control-attribution, .leaflet-control-zoom {
      display: none !important;
    }

    /* شريط البحث العائم */
    .search-box-container {
      position: absolute;
      top: 50px;
      left: 20px;
      right: 20px;
      z-index: 20;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .search-input-wrapper {
      flex: 1;
      position: relative;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 25px;
      display: flex;
      align-items: center;
      padding: 0 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .search-input {
      width: 100%;
      height: 52px;
      background: transparent;
      border: none;
      outline: none;
      color: #FFFFFF;
      font-size: 15px;
      padding-right: 10px;
      user-select: text;
    }

    .search-input::placeholder { color: #94A3B8; }

    .search-btn-icon {
      background: #38BDF8;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
    }

    /* الأزرار العائمة على الخريطة */
    .map-controls {
      position: absolute;
      bottom: 120px;
      left: 20px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .map-btn {
      width: 48px;
      height: 48px;
      border-radius: 24px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #38BDF8;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
      transition: all 0.2s ease;
    }

    .map-btn:active { transform: scale(0.9); }

    /* بطاقة التوجيه والملاحة السريعة بالأسفل */
    .bottom-nav-panel {
      position: absolute;
      bottom: 20px;
      left: 20px;
      right: 20px;
      z-index: 20;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 28px;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
    }

    .nav-info-title {
      font-size: 16px;
      font-weight: 800;
      color: #F8FAFC;
    }

    .nav-info-sub {
      font-size: 12px;
      color: #38BDF8;
      margin-top: 3px;
    }

    .start-nav-btn {
      background: linear-gradient(135deg, #38BDF8 0%, #0284C7 100%);
      color: #FFFFFF;
      border: none;
      padding: 12px 22px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(56, 189, 248, 0.35);
    }

    @keyframes pulseGlow {
      0% { transform: scale(0.9); opacity: 0.6; }
      100% { transform: scale(1.1); opacity: 1; }
    }

    @keyframes logoPop {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="screens-wrapper">
    
    <!-- ==================== الواجهة الأولى: شاشة الترحيب ==================== -->
    <div class="screen active" id="screen1">
      <div></div>

      <div class="logo-container" onclick="goToScreen2()">
        <div class="logo-glow"></div>
        
        <div class="logo-box">
          <svg class="logo-svg" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="cyanGrad" x1="0" y1="0" x2="200" y2="200">
                <stop stop-color="#38BDF8" />
                <stop offset="1" stop-color="#0284C7" />
              </linearGradient>
              <linearGradient id="goldGrad" x1="0" y1="0" x2="200" y2="200">
                <stop stop-color="#FACC15" />
                <stop offset="1" stop-color="#EAB308" />
              </linearGradient>
            </defs>

            <circle cx="100" cy="100" r="75" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="6 6" />
            
            <path d="M 45 135 L 155 135 L 145 112 L 55 112 Z" fill="url(#cyanGrad)" opacity="0.85" />
            <path d="M 60 108 L 140 108 L 130 88 L 70 88 Z" fill="url(#cyanGrad)" />
            <path d="M 75 84 L 125 84 L 118 68 L 82 68 Z" fill="url(#cyanGrad)" opacity="0.9" />
            <path d="M 92 135 L 108 135 L 104 68 L 96 68 Z" fill="url(#goldGrad)" opacity="0.9" />
            <circle cx="100" cy="52" r="7" fill="url(#goldGrad)" />
            <path d="M 100 40 L 100 44" stroke="#FACC15" stroke-width="2" stroke-linecap="round" />
          </svg>
        </div>

        <div class="brand-title">أُور</div>
        <div class="brand-subtitle">UR NAVIGATION</div>
      </div>

      <div class="bottom-badge">
        <span>صُنع بفخر في العراق</span>
        <span>🇮🇶</span>
      </div>
    </div>


    <!-- ==================== الواجهة الثانية: اختيار اللغة ==================== -->
    <div class="screen" id="screen2">
      <div class="lang-header-box">
        <div class="lang-title">
          اختر اللغة
          <span>Choose Language</span>
          <span class="kurdish">زمانێک هەڵبژێرە</span>
        </div>
      </div>

      <div class="buttons-container">
        <div class="lang-card" onclick="openMap('العربية')">
          <div>
            <div class="lang-name">العربية</div>
            <div class="lang-sub">Arabic</div>
          </div>
          <div class="lang-arrow">←</div>
        </div>

        <div class="lang-card" onclick="openMap('كوردى')">
          <div>
            <div class="lang-name">كوردى</div>
            <div class="lang-sub">Kurdish</div>
          </div>
          <div class="lang-arrow">←</div>
        </div>

        <div class="lang-card" onclick="openMap('English')">
          <div>
            <div class="lang-name">English</div>
            <div class="lang-sub">الإنجليزية</div>
          </div>
          <div class="lang-arrow">→</div>
        </div>
      </div>

      <div></div>
    </div>


    <!-- ==================== الواجهة الثالثة: الخريطة الرئيسية ==================== -->
    <div class="screen" id="screen3">
      
      <div id="map" class="dark-map-tiles"></div>

      <div class="search-box-container">
        <div class="search-input-wrapper">
          <input type="text" class="search-input" id="searchAddress" placeholder="ابحث عن منطقة، شارع، أو معلم..." />
          <button class="search-btn-icon" onclick="searchLocation()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#070B14" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          </button>
        </div>
      </div>

      <div class="map-controls">
        <button class="map-btn" onclick="locateUser()" title="موقعي الحالي">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path><circle cx="12" cy="12" r="7"></circle></svg>
        </button>
        <button class="map-btn" onclick="toggleMapStyle()" title="تغيير النمط">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
        </button>
      </div>

      <div class="bottom-nav-panel">
        <div>
          <div class="nav-info-title" id="selectedLocName">بغداد، العراق</div>
          <div class="nav-info-sub" id="selectedLocCoords">33.3152° N, 44.3661° E</div>
        </div>
        <button class="start-nav-btn" onclick="startNavigation()">ابدأ الملاحة</button>
      </div>

    </div>

  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    let map;
    let userMarker;
    let mapContainer;
    let isDarkStyle = true;

    const autoSplashTimeout = setTimeout(() => {
      goToScreen2();
    }, 3000);

    function goToScreen2() {
      clearTimeout(autoSplashTimeout);
      document.getElementById('screen1').classList.remove('active');
      document.getElementById('screen2').classList.add('active');
    }

    function openMap(lang) {
      document.getElementById('screen2').classList.remove('active');
      document.getElementById('screen3').classList.add('active');

      setTimeout(() => {
        initUrMap();
      }, 200);
    }

    function initUrMap() {
      if (map) return;

      const baghdadCoords = [33.3152, 44.3661];
      mapContainer = document.getElementById('map');

      map = L.map('map', {
        zoomControl: false
      }).setView(baghdadCoords, 12);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19
      }).addTo(map);

      userMarker = L.marker(baghdadCoords).addTo(map)
        .bindPopup('<b>مرحباً بك في أُور</b><br>بغداد، العراق')
        .openPopup();

      map.on('click', function(e) {
        const lat = e.latlng.lat.toFixed(4);
        const lng = e.latlng.lng.toFixed(4);
        
        userMarker.setLatLng(e.latlng);
        document.getElementById('selectedLocName').innerText = 'الموقع المحدد';
        document.getElementById('selectedLocCoords').innerText = `${lat}° N, ${lng}° E`;
      });
    }

    function locateUser() {
      if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(function(position) {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          
          map.setView([lat, lng], 15);
          userMarker.setLatLng([lat, lng]);
          
          document.getElementById('selectedLocName').innerText = 'موقعك الحالي';
          document.getElementById('selectedLocCoords').innerText = `${lat.toFixed(4)}° N, ${lng.toFixed(4)}° E`;
        }, function(error) {
          alert("تعذر تحديد الموقع. يرجى تفعيل الـ GPS في جهازك.");
        });
      } else {
        alert("ميزة تحديد الموقع غير مدعومة في متصفحك.");
      }
    }

    function toggleMapStyle() {
      if (!mapContainer) return;

      if (isDarkStyle) {
        mapContainer.classList.remove('dark-map-tiles');
        isDarkStyle = false;
      } else {
        mapContainer.classList.add('dark-map-tiles');
        isDarkStyle = true;
      }
    }

    function searchLocation() {
      const query = document.getElementById('searchAddress').value;
      if (!query) return;

      fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query + ' العراق')}`)
        .then(response => response.json())
        .then(data => {
          if (data && data.length > 0) {
            const lat = parseFloat(data[0].lat);
            const lon = parseFloat(data[0].lon);
            
            map.setView([lat, lon], 14);
            userMarker.setLatLng([lat, lon]);

            document.getElementById('selectedLocName').innerText = data[0].display_name.split(',')[0];
            document.getElementById('selectedLocCoords').innerText = `${lat.toFixed(4)}° N, ${lon.toFixed(4)}° E`;
          } else {
            alert('لم يتم العثور على المكان، جرب كتابة اسم آخر.');
          }
        })
        .catch(err => {
          alert('حدث خطأ أثناء البحث.');
        });
    }

    function startNavigation() {
      alert('جاري تشغيل محرك الملاحة والتوجيه المباشر...');
    }
  </script>
</body>
</html>
